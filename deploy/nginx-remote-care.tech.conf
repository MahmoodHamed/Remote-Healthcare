# Nginx site for remote-care.tech
# Install: sudo cp deploy/nginx-remote-care.tech.conf /etc/nginx/sites-available/remote-care.tech
#          sudo ln -sf /etc/nginx/sites-available/remote-care.tech /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name remote-care.tech www.remote-care.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remote-care.tech www.remote-care.tech;

    # ssl_certificate /etc/letsencrypt/live/remote-care.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/remote-care.tech/privkey.pem;

    # Static web app (adjust root to your deploy path)
    root /var/www/remote-care;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # RPM .NET API (docker compose exposes 8080 on the host)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /swagger/ {
        proxy_pass http://127.0.0.1:8080/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SignalR WebSockets (requires map $connection_upgrade in nginx.conf http {})
    location /hubs/ {
        proxy_pass http://127.0.0.1:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}
